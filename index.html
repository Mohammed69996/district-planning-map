  header{
    padding:24px 40px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:16px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .brand img{
    width:58px; height:58px;
    filter: drop-shadow(0 0 10px rgba(63,180,141,0.25));
  }
  .brand-eyebrow{
    font-size:12px;
    letter-spacing:2px;
    color:var(--green-bright);
    text-transform:uppercase;
    font-weight:700;
    margin-bottom:4px;
    display:block;
  }
  header h1{
    font-family:'Almarai', sans-serif;
    font-weight:800;
    font-size:26px;
    color:var(--text);
    letter-spacing:0.3px;
  }
  header h1 span{color:var(--green-bright);}
  .header-stats{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
  }
  .stat-chip{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 16px;
    text-align:center;
    min-width:86px;
  }
  .stat-chip b{
    display:block;
    font-family:'Almarai', sans-serif;
    font-size:18px;
    color:var(--green-bright);
  }
  .stat-chip span{
    font-size:11px;
    color:var(--text-muted);
  }

  .layout{
    direction:ltr;
    display:grid;
    grid-template-columns: 430px 1fr;
    gap:20px;
    padding:20px 40px 32px;
    flex:1;
    min-height:680px;
  }
  @media (max-width: 900px){
    .layout{grid-template-columns:1fr; min-height:auto;}
  }

  /* ===== Table panel (LEFT) ===== */
  .table-panel{
    direction:rtl;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .panel-head{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--border);
  }
  .panel-head h2{
    font-family:'Almarai', sans-serif;
    font-size:15px;
    font-weight:700;
    color:var(--green-bright);
    margin-bottom:12px;
  }
  .search-box input{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 14px;
    color:var(--text);
    font-family:'Tajawal';
    font-size:13px;
    outline:none;
    transition:border-color 0.2s;
  }
  .search-box input:focus{border-color:var(--green-bright);}
  .search-box input::placeholder{color:var(--text-muted);}
  .search-box select{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:8px;
    padding:9px 14px;
    color:var(--text);
    font-family:'Tajawal';
    font-size:13px;
    outline:none;
    cursor:pointer;
    transition:border-color 0.2s;
    appearance:none;
    -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239CB0AA' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:left 12px center;
  }
  .search-box select:focus{border-color:var(--green-bright);}
  .search-box select option{background:var(--surface-2); color:var(--text);}

  .legend{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:12px;
  }
  .legend-chip{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    padding:4px 9px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text-muted);
    cursor:pointer;
    user-select:none;
    transition:all 0.15s;
  }
  .legend-chip.active{
    color:var(--text);
    border-color:currentColor;
  }
  .legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

  .table-scroll{
    overflow-y:auto;
    flex:1;
  }
  .row-item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:13px 20px;
    border-bottom:1px solid rgba(255,255,255,0.04);
    cursor:pointer;
    transition:background 0.15s, border-color 0.15s;
    border-right:3px solid transparent;
  }
  .row-item:hover{background:rgba(63,180,141,0.06);}
  .row-item.selected{
    background:rgba(63,180,141,0.12);
    border-right-color:var(--green-bright);
  }
  .row-dot{
    width:10px;height:10px;border-radius:50%;flex-shrink:0;
    margin-top:5px;
    box-shadow:0 0 8px currentColor;
  }
  .row-text{flex:1; min-width:0;}
  .row-name{
    font-size:16px;
    font-weight:700;
    color:var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row-name-en{
    font-size:12px;
    color:var(--text-muted);
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin-top:1px;
  }
  .row-meta{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:6px;
  }
  .row-responsible{
    font-size:12px;
    color:var(--text-muted);
    margin-top:6px;
    line-height:1.5;
  }
  .row-responsible b{
    color:var(--text);
    font-weight:700;
    margin-inline-end:4px;
  }
  .row-developer{
    font-size:12px;
    color:var(--text-muted);
    margin-top:6px;
    line-height:1.5;
  }
  .row-developer b{
    color:var(--text);
    font-weight:700;
    margin-inline-end:4px;
  }
  .meta-pill{
    font-size:12.5px;
    color:var(--text-muted);
    background:var(--surface-2);
    padding:2px 8px;
    border-radius:6px;
    border:1px solid var(--border);
  }
  .status-badge{
    font-size:12px;
    font-weight:700;
    padding:2px 9px;
    border-radius:6px;
  }
  .status-open{background:rgba(46,204,113,0.18); color:var(--status-open);}
  .status-closed{background:rgba(181,97,90,0.18); color:var(--status-closed);}
  .status-approved{background:rgba(217,164,65,0.18); color:var(--status-approved);}

  .class-legend{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:14px;
    margin-bottom:10px;
    padding-bottom:10px;
    border-bottom:1px dashed var(--border);
  }
  .class-chip{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    padding:4px 9px;
    border-radius:20px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text-muted);
    cursor:pointer;
    user-select:none;
    transition:all 0.15s;
  }
  .class-chip.active{
    color:var(--text);
    border-color:var(--green-bright);
    background:rgba(63,180,141,0.14);
  }

  .table-scroll::-webkit-scrollbar{width:6px;}
  .table-scroll::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}

  /* ===== Map panel (RIGHT) ===== */
  .map-panel{
    direction:ltr;
    position:relative;
    border-radius:16px;
    overflow:hidden;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
  }
  #map{
    width:100%;
    height:100%;
    background:var(--surface);
  }
  .map-badge{
    position:absolute;
    top:16px;
    left:16px;
    z-index:500;
    background:rgba(12,22,19,0.85);
    backdrop-filter:blur(6px);
    border:1px solid var(--border);
    border-radius:10px;
    padding:8px 14px;
    font-size:12px;
    color:var(--green-bright);
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
    direction:rtl;
  }
  .leaflet-popup-content-wrapper{
    background:var(--surface);
    color:var(--text);
    border-radius:10px;
    border:1px solid var(--border);
    direction:rtl;
    font-family:'Tajawal';
  }
  .leaflet-popup-tip{background:var(--surface);}
  .popup-title{font-weight:700; color:var(--green-bright); margin-bottom:6px; font-family:'Almarai'; font-size:14px;}
  .popup-sub{font-size:11px; color:var(--text-muted); margin-bottom:8px;}
  .popup-row{font-size:12px; color:var(--text); margin-top:4px; display:flex; justify-content:space-between; gap:10px;}
  .popup-row b{color:var(--text-muted); font-weight:500;}
  .popup-status{display:inline-block; margin-top:6px;}
  .file-btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    margin-top:10px; width:100%;
    background:var(--green); color:#fff;
    border:1px solid var(--green-bright);
    border-radius:8px;
    padding:7px 12px;
    font-family:'Tajawal', sans-serif;
    font-size:12.5px;
    font-weight:700;
    text-decoration:none;
    cursor:pointer;
    transition:background 0.15s, transform 0.1s;
  }
  .file-btn:hover{background:var(--green-bright); color:#0C1613;}
  .file-btn:active{transform:scale(0.98);}
  .row-file-btn{
    display:inline-flex; align-items:center; gap:4px;
    font-size:11.5px; font-weight:700;
    color:var(--green-bright);
    background:rgba(63,180,141,0.12);
    border:1px solid var(--border);
    border-radius:6px;
    padding:2px 9px;
    text-decoration:none;
    transition:background 0.15s;
  }
  .row-file-btn:hover{background:rgba(63,180,141,0.24);}

  footer{
    text-align:center;
    padding:14px;
    font-size:11px;
    color:var(--text-muted);
    border-top:1px solid var(--border);
  }


  /* ===== Merged-page additions ===== */
  :root{
    --j-submission: var(--green-bright);
    --j-meeting: var(--status-approved);
    --j-subprocess: #9B8CE8;
    --j-deed: #4FA8D8;
    --j-submission-bg: rgba(63,180,141,0.14);
    --j-meeting-bg: rgba(217,164,65,0.14);
    --j-subprocess-bg: rgba(155,140,232,0.14);
    --j-deed-bg: rgba(79,168,216,0.14);
  }

  .layout{
    grid-template-columns: 380px 1fr 380px;
  }
  @media (max-width: 1300px){
    .layout{grid-template-columns: 340px 1fr 340px;}
  }
  @media (max-width: 1050px){
    .layout{grid-template-columns: 1fr; min-height:auto;}
    .map-panel{height:480px;}
    .journey-panel{height:auto; max-height:720px;}
  }

  /* ===== Row stat pills (journey summary inside list rows) ===== */
  .row-jstats{
    display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;
  }
  .row-jstat{
    font-size:11px; font-weight:700; padding:1px 8px; border-radius:20px;
    border:1px solid var(--border); color:var(--text-muted); background:var(--surface-2);
  }
  .row-jstat.has-data{color:var(--green-bright); border-color:rgba(63,180,141,0.35);}

  /* ===== Journey panel (RIGHT) ===== */
  .journey-panel{
    direction:rtl;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .journey-head{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--border);
  }
  .journey-head h2{
    font-family:'Almarai', sans-serif;
    font-size:15px;
    font-weight:700;
    color:var(--green-bright);
    margin-bottom:4px;
  }
  .journey-eyebrow{font-size:11px; letter-spacing:1px; color:var(--text-muted); text-transform:uppercase;}
  .journey-scroll{
    overflow-y:auto;
    flex:1;
    padding:16px 20px 24px;
  }
  .journey-scroll::-webkit-scrollbar{width:6px;}
  .journey-scroll::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}

  .journey-placeholder{
    padding:40px 20px;
    text-align:center;
    color:var(--text-muted);
    font-size:13px;
    line-height:1.8;
  }
  .journey-placeholder .icon{font-size:34px; display:block; margin-bottom:10px;}

  .jp-title{font-family:'Almarai', sans-serif; font-size:19px; font-weight:800; color:var(--text); line-height:1.35;}
  .jp-sub{font-size:12px; color:var(--text-muted); margin-top:4px;}

  .jp-card{
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-top:16px;
  }
  .jp-info-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:12px;}
  .jp-info-item .lbl{font-size:10.5px; color:var(--text-muted); margin-bottom:3px;}
  .jp-info-item .val{font-size:13px; font-weight:700; color:var(--text); font-family:'Tajawal'; line-height:1.5; word-break:break-word;}

  .jp-kpi-row{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:14px;}
  .jp-kpi{background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:11px 13px;}
  .jp-kpi .lbl{font-size:10.5px; color:var(--text-muted); margin-bottom:5px;}
  .jp-kpi .val{font-size:19px; font-weight:800; color:var(--green-bright); font-family:'Almarai';}
  .jp-kpi .val.small{font-size:13px;}

  .jp-file-btn{margin-top:14px;}

  .jp-legend{
    display:flex; flex-wrap:wrap; gap:10px; margin:18px 0 12px;
    font-size:11px; color:var(--text-muted);
  }
  .jp-legend span.sw{display:inline-block; width:8px; height:8px; border-radius:50%; margin-inline-end:5px; vertical-align:middle;}

  .jp-timeline{position:relative; padding-inline-end:22px;}
  .jp-timeline::before{
    content:''; position:absolute; right:7px; top:4px; bottom:4px; width:2px;
    background:var(--border);
  }
  .jp-tl-item{position:relative; padding-bottom:18px;}
  .jp-tl-item:last-child{padding-bottom:0;}
  .jp-tl-dot{
    position:absolute; right:0px; top:3px; width:16px; height:16px; border-radius:50%;
    border:3px solid var(--surface);
  }
  .jp-tl-dot.submission{background:var(--j-submission);}
  .jp-tl-dot.meeting{background:var(--j-meeting);}
  .jp-tl-dot.subprocess{background:var(--j-subprocess);}
  .jp-tl-dot.deed{background:var(--j-deed);}
  .jp-tl-body{
    margin-inline-end:28px; background:var(--surface-2); border:1px solid var(--border);
    border-radius:10px; padding:10px 12px;
  }
  .jp-tl-date{font-size:10.5px; color:var(--text-muted); margin-bottom:4px; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
  .jp-tl-title{font-size:13px; font-weight:700; color:var(--text);}
  .jp-tl-sub{font-size:11.5px; color:var(--text-muted); margin-top:2px;}

  .jp-kind-tag{
    font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
    padding:1px 7px; border-radius:5px;
  }
  .jp-kind-tag.submission{background:var(--j-submission-bg); color:var(--j-submission);}
  .jp-kind-tag.meeting{background:var(--j-meeting-bg); color:var(--j-meeting);}
  .jp-kind-tag.subprocess{background:var(--j-subprocess-bg); color:var(--j-subprocess);}
  .jp-kind-tag.deed{background:var(--j-deed-bg); color:var(--j-deed);}

  .jp-badge{display:inline-block; padding:2px 9px; border-radius:20px; font-size:10.5px; font-weight:700; margin-top:6px;}
  .jp-badge.approved{background:rgba(46,204,113,0.16); color:var(--status-open);}
  .jp-badge.returned{background:rgba(217,164,65,0.16); color:var(--status-approved);}
  .jp-badge.rejected{background:rgba(181,97,90,0.16); color:var(--status-closed);}
  .jp-badge.open{background:var(--j-subprocess-bg); color:var(--j-subprocess);}
  .jp-badge.closed{background:var(--j-deed-bg); color:var(--j-deed);}

  .jp-empty-note{
    margin-top:14px; font-size:12px; color:var(--text-muted); background:var(--surface-2);
    border:1px dashed var(--border); border-radius:10px; padding:12px 14px; line-height:1.7;
  }

</style>
</head>

const map = L.map('map', {zoomControl:true, attributionControl:false}).setView([24.7223, 46.5878], 15);

L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom:20, opacity:0.7
}).addTo(map);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_nolabels/{z}/{x}/{y}{r}.png', {
  maxZoom:20, opacity:0.22
}).addTo(map);

// ===== Permanent scope boundary layer (النطاق) — always on, not part of the table/search =====
const scopeLayer = L.polygon(SCOPE_RINGS, {
  color: '#E7DDBF',
  weight: 3,
  opacity: 0.85,
  dashArray: '10, 8',
  fill: false,
  lineJoin: 'round'
}).addTo(map);
scopeLayer.bindTooltip('حدود النطاق', {sticky:true, direction:'top'});

const statusColor = { 'Open': '#2ECC71', 'Closed': '#B5615A', 'Approvd': '#D9A441' };
const statusLabel_ar = { 'Open': 'مفتوح', 'Closed': 'مغلق', 'Approvd': 'معتمد' };
const statusClass = { 'Open': 'status-open', 'Closed': 'status-closed', 'Approvd': 'status-approved' };

document.getElementById('panelTitle').textContent = `قائمة المشاريع (${FEATURES.length})`;

const polyById = {};
let selectedId = null;

FEATURES.forEach(f => {
  const color = statusColor[f.status_raw] || '#6E8F87';
  const layers = f.rings.map(ring => L.polygon(ring, {
    color: color,
    weight: 2.2,
    fillColor: color,
    fillOpacity: 0.22,
    opacity: 0.9
  }));
  const group = L.layerGroup(layers).addTo(map);

  const popupHtml = `
    <div class="popup-title">${f.name_ar}</div>
    <div class="popup-sub">${f.name_en} &middot; ${f.id}</div>
    <div class="popup-row"><b>المساحة</b><span>${f.area}</span></div>
    <div class="popup-row"><b>حالة المشروع</b><span class="popup-status status-badge ${statusClass[f.status_raw] || 'status-closed'}">${statusLabel_ar[f.status_raw] || f.status_raw}</span></div>
    <div class="popup-row"><b>عدد الوحدات</b><span>${f.units ?? '—'}</span></div>
    <div class="popup-row"><b>تصنيف المشروع</b><span>${f.category ?? '—'}</span></div>
    <div class="popup-row"><b>الجهة المسؤولة</b><span>${f.responsible ?? '—'}</span></div>
    <div class="popup-row"><b>المطور</b><span>${f.developer ?? '—'}</span></div>
    ${f.file ? `<a class="file-btn" href="${f.file}" target="_blank" rel="noopener">📄 ملف المشروع</a>` : ''}
  `;
  layers.forEach(pl => {
    pl.bindPopup(popupHtml);
    pl.on('click', () => selectRow(f.id, true));
  });

  polyById[f.id] = group;
});

function getBoundsFor(id){
  const group = polyById[id];
  let bounds = null;
  group.eachLayer(l => {
    bounds = bounds ? bounds.extend(l.getBounds()) : l.getBounds();
  });
  return bounds;
}

function resetStyles(){
  FEATURES.forEach(f => {
    const color = statusColor[f.status_raw] || '#6E8F87';
    polyById[f.id].eachLayer(l => l.setStyle({weight:2.2, fillOpacity:0.22, opacity:0.9}));
  });
}

function selectRow(id, fromMap){
  selectedId = id;
  resetStyles();
  const group = polyById[id];
  if(group){
    group.eachLayer(l => { l.setStyle({weight:4, fillOpacity:0.4, opacity:1}); l.bringToFront(); });
    const bounds = getBoundsFor(id);
    map.flyToBounds(bounds, {padding:[80,80], duration:0.9, maxZoom:18});
    if(fromMap){
      let first = null;
      group.eachLayer(l => { if(!first) first = l; });
      setTimeout(() => first && first.openPopup(), 400);
    } else {
      let first = null;
      group.eachLayer(l => { if(!first) first = l; });
      setTimeout(() => first && first.openPopup(), 400);
    }
  }
  renderTable();
  const el = document.querySelector('.row-item[data-id="'+id+'"]');
  if(el) el.scrollIntoView({block:'nearest', behavior:'smooth'});
  const selectEl = document.getElementById('projectSelect');
  if(selectEl && selectEl.value !== id) selectEl.value = id;
}

// ===== Header stats =====
const openCount = FEATURES.filter(f=>f.status_raw==='Open').length;
const closedCount = FEATURES.filter(f=>f.status_raw==='Closed').length;
const approvedCount = FEATURES.filter(f=>f.status_raw==='Approvd').length;
const headerStats = document.getElementById('headerStats');
headerStats.innerHTML = `
  <div class="stat-chip"><b>${FEATURES.length}</b><span>إجمالي المشاريع</span></div>
  <div class="stat-chip"><b>${openCount}</b><span>مفتوحة</span></div>
  <div class="stat-chip"><b>${closedCount}</b><span>مغلقة</span></div>
  <div class="stat-chip"><b>${approvedCount}</b><span>معتمدة</span></div>
`;

// ===== Classification legend (filter by تصنيف المشروع) =====
const NO_CLASS = '__NONE__';
const classCounts = {};
FEATURES.forEach(f => {
  const key = f.category || NO_CLASS;
  classCounts[key] = (classCounts[key] || 0) + 1;
});
const classKeys = Object.keys(classCounts).sort((a,b) => {
  if(a===NO_CLASS) return 1;
  if(b===NO_CLASS) return -1;
  return a.localeCompare(b, 'ar');
});
const classLegendEl = document.getElementById('classLegend');
let activeClassFilters = new Set(classKeys);
classKeys.forEach(key => {
  const chip = document.createElement('div');
  chip.className = 'class-chip active';
  const label = key===NO_CLASS ? 'غير مصنف' : key;
  chip.innerHTML = `${label} (${classCounts[key]})`;
  chip.addEventListener('click', () => {
    if(activeClassFilters.has(key)){ activeClassFilters.delete(key); chip.classList.remove('active'); }
    else{ activeClassFilters.add(key); chip.classList.add('active'); }
    applyFilters();
  });
  classLegendEl.appendChild(chip);
});

// ===== Legend (status filter) =====
const legendEl = document.getElementById('legend');
let activeFilters = new Set(['Open','Closed','Approvd']);
[['Open','مفتوحة'], ['Closed','مغلقة'], ['Approvd','معتمدة']].forEach(([key,label]) => {
  const chip = document.createElement('div');
  chip.className = 'legend-chip active';
  chip.style.color = statusColor[key];
  const count = key==='Open' ? openCount : (key==='Closed' ? closedCount : approvedCount);
  chip.innerHTML = `<span class="legend-dot" style="background:${statusColor[key]}"></span>${label} (${count})`;
  chip.addEventListener('click', () => {
    if(activeFilters.has(key)){ activeFilters.delete(key); chip.classList.remove('active'); }
    else{ activeFilters.add(key); chip.classList.add('active'); }
    applyFilters();
  });
  legendEl.appendChild(chip);
});

function applyFilters(){
  FEATURES.forEach(f => {
    const classKey = f.category || NO_CLASS;
    const visible = activeFilters.has(f.status_raw) && activeClassFilters.has(classKey);
    const group = polyById[f.id];
    if(visible){ if(!map.hasLayer(group)) group.addTo(map); }
    else{ if(map.hasLayer(group)) map.removeLayer(group); }
  });
  renderTable();
}

// ===== Table =====
const tableScroll = document.getElementById('tableScroll');

function renderTable(){
  tableScroll.innerHTML = '';
  FEATURES.filter(f => activeFilters.has(f.status_raw))
    .filter(f => activeClassFilters.has(f.category || NO_CLASS))
    .forEach(f => {
      const row = document.createElement('div');
      row.className = 'row-item' + (f.id === selectedId ? ' selected' : '');
      row.setAttribute('data-id', f.id);
      const color = statusColor[f.status_raw];
      row.innerHTML = `
        <span class="row-dot" style="background:${color}; color:${color}"></span>
        <div class="row-text">
          <div class="row-name">${f.name_ar}</div>
          <div class="row-name-en">${f.name_en}</div>
          <div class="row-meta">
            <span class="meta-pill">${f.area}</span>
            ${f.units ? `<span class="meta-pill">${f.units} وحدة</span>` : ''}
            ${f.category ? `<span class="meta-pill">${f.category}</span>` : ''}
            <span class="status-badge ${statusClass[f.status_raw] || 'status-closed'}">${statusLabel_ar[f.status_raw] || f.status_raw}</span>
            ${f.file ? `<a class="row-file-btn" href="${f.file}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📄 ملف المشروع</a>` : ''}
          </div>
          ${f.responsible ? `<div class="row-responsible"><b>الجهة المسؤولة:</b> ${f.responsible}</div>` : ''}
          ${f.developer ? `<div class="row-developer"><b>المطور:</b> ${f.developer}</div>` : ''}
        </div>
      `;
      row.addEventListener('click', () => selectRow(f.id, false));
      tableScroll.appendChild(row);
    });
}

renderTable();

// ===== Project number/name dropdown selector =====
const projectSelect = document.getElementById('projectSelect');
FEATURES.slice().sort((a,b) => a.id.localeCompare(b.id)).forEach(f => {
  const opt = document.createElement('option');
  opt.value = f.id;
  opt.textContent = `${f.id} — ${f.name_ar}${f.name_en ? ' / ' + f.name_en : ''}`;
  projectSelect.appendChild(opt);
});
projectSelect.addEventListener('change', () => {
  if(projectSelect.value) selectRow(projectSelect.value, false);
});

// initial fit to all features
let allBounds = null;
FEATURES.forEach(f => {
  const b = getBoundsFor(f.id);
  allBounds = allBounds ? allBounds.extend(b) : b;
});
map.fitBounds(allBounds, {padding:[40,40]});

_vip": null, "events": []}};


// =========================================================
// ===== Merged addition: Project Journey side panel  =====
// =========================================================

const featureById = {};
FEATURES.forEach(f => { featureById[f.id] = f; });

function fmtNum(n){ return (n===null || n===undefined) ? '–' : new Intl.NumberFormat('en-US').format(Math.round(n)); }

function decisionBadgeClass(dec){
  if(!dec) return 'open';
  if(dec.includes('Approved')) return 'approved';
  if(dec.includes('Rejected')) return 'rejected';
  return 'returned';
}

const journeyScroll = document.getElementById('journeyScroll');

function journeyPlaceholder(){
  journeyScroll.innerHTML = `
    <div class="journey-placeholder">
      <span class="icon">🗂️</span>
      اختر مشروعًا من القائمة أو من الخريطة<br>لعرض مساره الكامل من أول تواصل حتى الصك
    </div>`;
  document.getElementById('journeyEyebrow').textContent = 'مسار المشروع';
  document.getElementById('journeyName').textContent = 'لم يتم اختيار مشروع بعد';
}

function renderJourney(id){
  const p = PROJECTS[id];
  const f = featureById[id];
  if(!p && !f) { journeyPlaceholder(); return; }

  const name = (p && p.name) || (f && f.name_ar) || id;
  document.getElementById('journeyEyebrow').textContent = 'مسار المشروع الكامل';
  document.getElementById('journeyName').textContent = name;

  const ownerType = (p && p.owner_type) || '–';
  const owner = (p && p.owner) || (f && f.developer) || '–';
  const ptype = (p && (p.ptype||'').trim()) || (f && f.category) || '–';
  const district = (p && p.district) || '–';
  const area = fmtNum((p && p.area) ?? (f && f.area_raw));
  const plots = (p && p.plots!=null) ? p.plots : '–';
  const transect = (p && p.transect) || '–';
  const consultant = (p && p.consultant) ? p.consultant.split('\n')[0] : '–';
  const status = f ? (statusLabel_ar[f.status_raw] || f.status_raw) : '–';
  const units = (f && f.units) || '–';
  const responsible = (f && f.responsible) || '–';
  const fileUrl = f && f.file;

  const events = (p && p.events) || [];
  const subs = events.filter(e=>e.type==='submission');
  const meets = events.filter(e=>e.type==='meeting');
  const procs = events.filter(e=>e.type==='subprocess');
  const deeds = events.filter(e=>e.type==='deed');
  const lastDecision = [...subs].reverse().find(s=>s.decision);

  let html = `
    <div class="jp-title">${name}</div>
    <div class="jp-sub">${id}${f ? ' · ' + status : ''}${ownerType!=='–' ? ' · ' + ownerType : ''}</div>

    <div class="jp-card">
      <div class="jp-info-grid">
        <div class="jp-info-item"><div class="lbl">المالك / المطوّر</div><div class="val">${owner}</div></div>
        <div class="jp-info-item"><div class="lbl">نوع المشروع</div><div class="val">${ptype}</div></div>
        <div class="jp-info-item"><div class="lbl">الحي</div><div class="val">${district}</div></div>
        <div class="jp-info-item"><div class="lbl">المساحة (م²)</div><div class="val">${area}</div></div>
        <div class="jp-info-item"><div class="lbl">عدد القطع</div><div class="val">${plots}</div></div>
        <div class="jp-info-item"><div class="lbl">المقطع التنظيمي</div><div class="val">${transect}</div></div>
        <div class="jp-info-item"><div class="lbl">الاستشاري</div><div class="val">${consultant}</div></div>
        <div class="jp-info-item"><div class="lbl">عدد الوحدات</div><div class="val">${units}</div></div>
      </div>
      ${responsible!=='–' ? `<div class="jp-info-item" style="margin-top:12px;"><div class="lbl">الجهة المسؤولة</div><div class="val">${responsible}</div></div>` : ''}
      ${fileUrl ? `<a class="file-btn jp-file-btn" href="${fileUrl}" target="_blank" rel="noopener">📄 ملف المشروع</a>` : ''}
    </div>

    <div class="jp-kpi-row">
      <div class="jp-kpi"><div class="lbl">عدد التقديمات</div><div class="val">${subs.length}</div></div>
      <div class="jp-kpi"><div class="lbl">اجتماعات / زيارات</div><div class="val">${meets.length}</div></div>
      <div class="jp-kpi"><div class="lbl">تحويلات لجهات أخرى</div><div class="val">${procs.length}</div></div>
      <div class="jp-kpi"><div class="lbl">آخر قرار</div><div class="val small">${lastDecision ? lastDecision.decision : '—'}</div></div>
    </div>
  `;

  if(events.length===0){
    html += `<div class="jp-empty-note">لا توجد بيانات مسار تفصيلية (تقديمات / اجتماعات / صكوك) مسجّلة لهذا المشروع حتى الآن — البيانات المعروضة أعلاه مأخوذة من خريطة المشاريع فقط.</div>`;
  } else {
    html += `
      <div class="jp-legend">
        <span><span class="sw" style="background:var(--j-meeting)"></span>اجتماع / زيارة حضورية</span>
        <span><span class="sw" style="background:var(--j-submission)"></span>تقديم (طلب)</span>
        <span><span class="sw" style="background:var(--j-subprocess)"></span>تحويل لجهة خارجية</span>
        <span><span class="sw" style="background:var(--j-deed)"></span>صك أرض</span>
      </div>
      <div class="jp-timeline">
    `;
    events.forEach(e=>{
      let title='', sub='', badge='';
      if(e.type==='submission'){
        title = e.title;
        const cls = decisionBadgeClass(e.decision);
        badge = `<span class="jp-badge ${cls}">${e.decision || 'قيد المراجعة'}</span>`;
        sub = e.cert ? `شهادة رقم ${e.cert}` : '';
      } else if(e.type==='meeting'){
        title = e.title;
        sub = e.desc || '';
      } else if(e.type==='subprocess'){
        title = e.title || 'خطوة تحويل';
        sub = e.subtitle ? `الجهة: ${e.subtitle}` : '';
        const cls = (e.status||'').toLowerCase().includes('close') || (e.status||'').toLowerCase().includes('complete') ? 'closed':'open';
        badge = `<span class="jp-badge ${cls}">${e.status || 'مفتوح'}</span>`;
      } else if(e.type==='deed'){
        title = e.title;
        sub = (e.area ? `المساحة: ${fmtNum(e.area)} م²` : '') + (e.is_current ? ' · ساري' : '');
      }
      const dateLabel = e.date || (e.type==='deed' ? 'صك مسجّل (بدون تاريخ)' : 'بدون تاريخ');
      const kindLabel = {submission:'تقديم', meeting:'اجتماع', subprocess:'تحويل', deed:'صك'}[e.type];
      html += `
        <div class="jp-tl-item">
          <div class="jp-tl-dot ${e.type}"></div>
          <div class="jp-tl-body">
            <div class="jp-tl-date">${dateLabel} <span class="jp-kind-tag ${e.type}">${kindLabel}</span></div>
            <div class="jp-tl-title">${title}</div>
            ${sub ? `<div class="jp-tl-sub">${sub}</div>` : ''}
            ${badge}
          </div>
        </div>`;
    });
    html += `</div>`;
  }

  journeyScroll.innerHTML = html;
}

// ===== Hook the journey panel into the existing selection flow =====
const _origSelectRow = selectRow;
selectRow = function(id, fromMap){
  _origSelectRow(id, fromMap);
  renderJourney(id);
};

// ===== Extra merged header stats (submissions / meetings / deeds across all projects) =====
(function(){
  let totalSubs = 0, totalMeets = 0, totalDeeds = 0;
  Object.values(PROJECTS).forEach(p => {
    (p.events||[]).forEach(e=>{
      if(e.type==='submission') totalSubs++;
      else if(e.type==='meeting') totalMeets++;
      else if(e.type==='deed') totalDeeds++;
    });
  });
  const headerStats = document.getElementById('headerStats');
  headerStats.innerHTML += `
    <div class="stat-chip"><b>${totalSubs}</b><span>إجمالي التقديمات</span></div>
    <div class="stat-chip"><b>${totalMeets}</b><span>الاجتماعات</span></div>
    <div class="stat-chip"><b>${totalDeeds}</b><span>الصكوك</span></div>
  `;
})();

// ===== Add journey mini-stats into each list row =====
const _origRenderTable = renderTable;
renderTable = function(){
  _origRenderTable();
  document.querySelectorAll('.row-item').forEach(row=>{
    const id = row.getAttribute('data-id');
    const p = PROJECTS[id];
    const textEl = row.querySelector('.row-text');
    if(!textEl) return;
    const subsCount = p ? (p.events||[]).filter(e=>e.type==='submission').length : 0;
    const meetsCount = p ? (p.events||[]).filter(e=>e.type==='meeting').length : 0;
    const hasData = !!p && (p.events||[]).length>0;
    const stats = document.createElement('div');
    stats.className = 'row-jstats';
    stats.innerHTML = hasData
      ? `<span class="row-jstat has-data">📄 ${subsCount} تقديم</span><span class="row-jstat has-data">🤝 ${meetsCount} اجتماع</span>`
      : `<span class="row-jstat">لا يوجد مسار مسجّل</span>`;
    textEl.appendChild(stats);
  });
};
renderTable();

// ===== Default selection on load: showcase the richest project journey =====
journeyPlaceholder();
setTimeout(() => {
  const defaultId = PROJECTS['P0115'] ? 'P0115' : FEATURES[0].id;
  selectRow(defaultId, false);
}, 300);

</script>
